name: Connect IQ CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

# SDK-Version zentral pflegen
env:
  CIQ_SDK_VERSION: "7.4.3"

jobs:
  build:
    name: Build Watchface (Epix Pro Gen 2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Connect IQ SDK dynamisch ueber den offiziellen Manager herunterladen
      - name: Install Connect IQ SDK
        run: |
          # SDK Manager herunterladen
          curl -L "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-manager-linux.zip" \
            -o /tmp/sdk-manager.zip

          # Pruefen ob wirklich ein ZIP angekommen ist
          file /tmp/sdk-manager.zip | grep -q 'Zip archive' || {
            echo "ERROR: SDK Manager Download ist kein ZIP."
            echo "HTTP-Response-Inhalt:"
            cat /tmp/sdk-manager.zip
            exit 1
          }

          mkdir -p $HOME/ciq-manager
          unzip -q /tmp/sdk-manager.zip -d $HOME/ciq-manager
          chmod +x $HOME/ciq-manager/bin/sdkmanager

          # SDK installieren (non-interactive)
          $HOME/ciq-manager/bin/sdkmanager \
            --sdk-install $CIQ_SDK_VERSION \
            --install-dir $HOME/ciq-sdk \
            --non-interactive

          echo "$HOME/ciq-sdk/$CIQ_SDK_VERSION/bin" >> $GITHUB_PATH

      - name: Verify monkeyc installation
        run: monkeyc --version

      - name: Restore developer key
        run: |
          mkdir -p $HOME/.garmin
          echo "${{ secrets.GARMIN_DEVELOPER_KEY }}" | base64 -d > $HOME/.garmin/developer_key.der
          # Sicherstellen dass die DER-Datei gueltig ist
          openssl pkcs8 -inform DER -in $HOME/.garmin/developer_key.der -nocrypt -out /dev/null 2>&1 \
            && echo "Developer Key OK" \
            || { echo "ERROR: Developer Key ist unguelig oder korrupt"; exit 1; }

      - name: Create output directory
        run: mkdir -p bin

      - name: Build for epixpro2
        run: |
          monkeyc \
            -f monkey.jungle \
            -o bin/WatchfaceBuilder.prg \
            -y $HOME/.garmin/developer_key.der \
            -d epixpro2 \
            -t Release

      - name: Upload .prg artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchface-epixpro2
          path: bin/WatchfaceBuilder.prg
          retention-days: 14

  lint:
    name: Monkey C Typecheck
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Connect IQ SDK
        run: |
          curl -L "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-manager-linux.zip" \
            -o /tmp/sdk-manager.zip
          file /tmp/sdk-manager.zip | grep -q 'Zip archive' || { cat /tmp/sdk-manager.zip; exit 1; }
          mkdir -p $HOME/ciq-manager
          unzip -q /tmp/sdk-manager.zip -d $HOME/ciq-manager
          chmod +x $HOME/ciq-manager/bin/sdkmanager
          $HOME/ciq-manager/bin/sdkmanager \
            --sdk-install $CIQ_SDK_VERSION \
            --install-dir $HOME/ciq-sdk \
            --non-interactive
          echo "$HOME/ciq-sdk/$CIQ_SDK_VERSION/bin" >> $GITHUB_PATH

      - name: Restore developer key
        run: |
          mkdir -p $HOME/.garmin
          echo "${{ secrets.GARMIN_DEVELOPER_KEY }}" | base64 -d > $HOME/.garmin/developer_key.der

      - name: Run Monkey C typecheck
        run: |
          monkeyc \
            -f monkey.jungle \
            -y $HOME/.garmin/developer_key.der \
            -d epixpro2 \
            --typecheck 3
