name: Connect IQ CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Watchface (Epix Pro Gen 2)
    runs-on: ubuntu-latest

    steps:
      # 1. Code auschecken
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java JDK installieren (Connect IQ SDK benoetigt Java)
      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Connect IQ SDK herunterladen
      - name: Download Connect IQ SDK
        run: |
          mkdir -p $HOME/ciq-sdk
          curl -L "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-7.4.3-2024-10-24-8e1b31a47.zip" \
            -o /tmp/ciq-sdk.zip
          unzip -q /tmp/ciq-sdk.zip -d $HOME/ciq-sdk
          chmod +x $HOME/ciq-sdk/bin/monkeyc
          echo "$HOME/ciq-sdk/bin" >> $GITHUB_PATH

      # 4. Entwickler-Schluessel aus GitHub Secret wiederherstellen
      - name: Restore developer key
        run: |
          mkdir -p $HOME/.garmin
          echo "${{ secrets.GARMIN_DEVELOPER_KEY }}" | base64 -d > $HOME/.garmin/developer_key.der

      # 5. Build fuer Epix Pro Gen 2
      - name: Build for epixpro2
        run: |
          monkeyc \
            -f monkey.jungle \
            -o bin/WatchfaceBuilder.prg \
            -y $HOME/.garmin/developer_key.der \
            -d epixpro2 \
            -t Release

      # 6. Build-Artefakt hochladen
      - name: Upload .prg artifact
        uses: actions/upload-artifact@v4
        with:
          name: watchface-epixpro2
          path: bin/WatchfaceBuilder.prg
          retention-days: 14

  lint:
    name: Monkey C Lint
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Connect IQ SDK
        run: |
          mkdir -p $HOME/ciq-sdk
          curl -L "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-7.4.3-2024-10-24-8e1b31a47.zip" \
            -o /tmp/ciq-sdk.zip
          unzip -q /tmp/ciq-sdk.zip -d $HOME/ciq-sdk
          chmod +x $HOME/ciq-sdk/bin/monkeyc
          echo "$HOME/ciq-sdk/bin" >> $GITHUB_PATH

      - name: Restore developer key
        run: |
          mkdir -p $HOME/.garmin
          echo "${{ secrets.GARMIN_DEVELOPER_KEY }}" | base64 -d > $HOME/.garmin/developer_key.der

      # Monkey C Typcheck (kein Build, nur Analyse)
      - name: Run Monkey C type checker
        run: |
          monkeyc \
            -f monkey.jungle \
            -y $HOME/.garmin/developer_key.der \
            -d epixpro2 \
            --typecheck 3
