name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  CIQ_SDK_VERSION: "7.4.3"

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Connect IQ SDK
        run: |
          curl -L "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-manager-linux.zip" \
            -o /tmp/sdk-manager.zip
          file /tmp/sdk-manager.zip | grep -q 'Zip archive' || { cat /tmp/sdk-manager.zip; exit 1; }
          mkdir -p $HOME/ciq-manager
          unzip -q /tmp/sdk-manager.zip -d $HOME/ciq-manager
          chmod +x $HOME/ciq-manager/bin/sdkmanager
          $HOME/ciq-manager/bin/sdkmanager \
            --sdk-install $CIQ_SDK_VERSION \
            --install-dir $HOME/ciq-sdk \
            --non-interactive
          echo "$HOME/ciq-sdk/$CIQ_SDK_VERSION/bin" >> $GITHUB_PATH

      - name: Restore developer key
        run: |
          mkdir -p $HOME/.garmin
          echo "${{ secrets.GARMIN_DEVELOPER_KEY }}" | base64 -d > $HOME/.garmin/developer_key.der

      - name: Create output directory
        run: mkdir -p bin

      - name: Build Release .prg
        run: |
          monkeyc \
            -f monkey.jungle \
            -o bin/WatchfaceBuilder.prg \
            -y $HOME/.garmin/developer_key.der \
            -d epixpro2 \
            -t Release

      - name: Package .iq for Connect IQ Store
        run: |
          monkeyc \
            -f monkey.jungle \
            -o bin/WatchfaceBuilder.iq \
            -y $HOME/.garmin/developer_key.der \
            -d epixpro2 \
            --package-app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/WatchfaceBuilder.prg
            bin/WatchfaceBuilder.iq
          body: |
            ## Watchface Builder ${{ github.ref_name }}

            ### Enthaltene Themes
            - Minimal Sport
            - Cartoon Retro
            - Nuclear Terminal
            - Neon City
            - Custom

            ### Installation
            `.prg` Datei nach `GARMIN/APPS/` auf der Uhr kopieren.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
