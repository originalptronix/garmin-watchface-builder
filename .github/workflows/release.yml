name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Connect IQ SDK
        run: |
          mkdir -p $HOME/ciq-sdk
          curl -L "https://developer.garmin.com/downloads/connect-iq/sdks/connectiq-sdk-lin-7.4.3-2024-10-24-8e1b31a47.zip" \
            -o /tmp/ciq-sdk.zip
          unzip -q /tmp/ciq-sdk.zip -d $HOME/ciq-sdk
          chmod +x $HOME/ciq-sdk/bin/monkeyc
          echo "$HOME/ciq-sdk/bin" >> $GITHUB_PATH

      - name: Restore developer key
        run: |
          mkdir -p $HOME/.garmin
          echo "${{ secrets.GARMIN_DEVELOPER_KEY }}" | base64 -d > $HOME/.garmin/developer_key.der

      - name: Build Release
        run: |
          monkeyc \
            -f monkey.jungle \
            -o bin/WatchfaceBuilder.prg \
            -y $HOME/.garmin/developer_key.der \
            -d epixpro2 \
            -t Release

      # IQ-Paket fuer Connect IQ Store erstellen
      - name: Package .iq file
        run: |
          monkeyc \
            -f monkey.jungle \
            -o bin/WatchfaceBuilder.iq \
            -y $HOME/.garmin/developer_key.der \
            -d epixpro2 \
            --package-app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/WatchfaceBuilder.prg
            bin/WatchfaceBuilder.iq
          body: |
            ## Watchface Builder ${{ github.ref_name }}

            ### Enthaltene Themes
            - Minimal Sport
            - Cartoon Retro
            - Nuclear Terminal
            - Neon City
            - Custom

            ### Installation
            `.prg` Datei nach `GARMIN/APPS/` auf der Uhr kopieren.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
